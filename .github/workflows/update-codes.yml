name: 每日更新地图密码

on:
  # 韩国时间 05:17、06:17、07:37、08:43；北京时间早一小时。
  schedule:
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
    - cron: "37 22 * * *"
    - cron: "43 23 * * *"
  workflow_dispatch:

# 同一时间只运行一个抓取任务；手动运行也与定时任务串行。
concurrency:
  group: "daily-code-update"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取项目文件
        uses: actions/checkout@v7
        with:
          # 排队期间可能已有任务提交了当天密码，启动后读取分支最新版本。
          ref: ${{ github.ref }}

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 获取今日密码并更新 JSON
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python scripts/update_codes.py --skip-if-today
          else
            python scripts/update_codes.py
          fi

      - name: 提交更新后的密码
        run: |
          if git diff --quiet -- codes.json; then
            echo "密码没有变化，不需要提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          git commit -m "更新三角洲每日地图密码"
          git push
