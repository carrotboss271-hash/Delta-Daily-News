name: 每日更新地图密码

on:
  # UTC 20:17、20:37、21:17 对应韩国时间 05:17、05:37、06:17。
  # 北京时间分别为 04:17、04:37、05:17。
  schedule:
    - cron: "17 20 * * *"
    - cron: "37 20 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

# 同一时间只运行一个抓取任务；手动运行也与定时任务串行。
concurrency:
  group: "daily-code-update"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取项目文件
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 获取今日密码并更新 JSON
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/update_codes.py --skip-if-today
          else
            python scripts/update_codes.py
          fi

      - name: 提交更新后的密码
        run: |
          if git diff --quiet -- codes.json; then
            echo "密码没有变化，不需要提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          git commit -m "更新三角洲每日地图密码"
          git push
