# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # 自动提交使用 GITHUB_TOKEN，不会触发 push 工作流；更新成功后单独启动部署。
  workflow_run:
    workflows: ["每日更新地图密码"]
    types: [completed]
    branches: [master]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 需要部署更新任务提交后的最新 master。
          ref: master
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Compare online codes before automatic publish
        id: codes-check
        if: github.event_name == 'workflow_run'
        env:
          PAGES_CODES_URL: https://carrotboss271-hash.github.io/Delta-Daily-News/codes.json
        run: python scripts/should_deploy_pages.py

      - name: Upload artifact
        if: github.event_name != 'workflow_run' || steps.codes-check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages (first attempt)
        id: deployment
        if: github.event_name != 'workflow_run' || steps.codes-check.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
